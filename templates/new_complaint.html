{% extends 'base.html' %}
{% block title %}Submit a Complaint{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <a href="{{ url_for('dashboard') }}" class="text-decoration-none">&larr; Back to Dashboard</a>
                <h4 class="card-title mb-3 mt-2">Submit a Complaint</h4>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category_id" class="form-select" required>
                            <option value="" selected disabled>Choose a category</option>
                            {% for c in categories %}
                                <option value="{{ c.id }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control"
                               placeholder="Short summary of the issue" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="5"
                                  placeholder="Describe what happened, where and when" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Attachment (optional)</label>
                        <input type="file" name="attachment" class="form-control">
                        <div class="form-text">Allowed: images, PDF, DOCX.</div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_anonymous" id="anon">
                        <label class="form-check-label" for="anon">
                            Submit anonymously (your identity will be hidden from the handler)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Submit Complaint</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
